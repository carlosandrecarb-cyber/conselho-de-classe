<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Impressão: Bilhetes Oficiais com Fundamentação Legal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    @page { size: A4 portrait; margin: 8mm; } 
    body { font-family: 'Inter', Arial, sans-serif; margin: 0; background: #e2e8f0; } 
    
    .no-print { background: #0f172a; padding: 15px; display: flex; gap: 15px; justify-content: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    select { padding: 8px; border-radius: 6px; border: none; font-weight: bold; outline: none; }
    .btn-acao { background: #10b981; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    
    #relatorioContainer { display: flex; flex-direction: column; align-items: center; padding-top: 20px; }

    .pagina-a4 { width: 100%; max-width: 210mm; height: 280mm; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; page-break-after: always; display: flex; flex-direction: column; }
    
    .bilhete { flex: 1; padding: 8mm 12mm; border-bottom: 1.5px solid #cbd5e1; display: flex; flex-direction: column; justify-content: center; }
    .bilhete:nth-child(4) { border-bottom: none; } 

    .header-b { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .header-b img { height: 35px; }
    .header-b h2 { margin: 0; font-size: 9.5pt; font-weight: 900; text-transform: uppercase; color: #0f172a; }
    .header-b p { margin: 1px 0 0 0; font-size: 7.5pt; color: #475569; }

    .texto-oficial { font-size: 8.5pt; color: #334155; line-height: 1.3; margin-bottom: 8px; text-align: justify; }
    .texto-sucesso { font-size: 8.5pt; color: #065f46; font-weight: bold; line-height: 1.3; margin-bottom: 8px; background: #d1fae5; padding: 4px 8px; border-radius: 4px; border: 1px solid #10b981; }
    
    .tarja-estudante { background: #f8fafc; border: 1px solid #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 9pt; font-weight: 900; color: #0f172a; margin-bottom: 10px; display: flex; justify-content: space-between; }
    
    .disciplinas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-bottom: 8px; }
    .disp-item { font-size: 7.5pt; padding: 4px 6px; border: 1px solid #e2e8f0; border-radius: 4px; text-align: left; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
    
    .disp-rec { background: #fee2e2; border-color: #ef4444; color: #991b1b; font-weight: 900; }
    .disp-ei { background: #fef3c7; border-color: #f59e0b; color: #92400e; font-weight: 900; }
    .disp-janeiro { background: #ffedd5; border-color: #f97316; color: #9a3412; font-weight: 900; }
    .disp-aprovado { background: #f0fdf4; border-color: #bbf7d0; color: #166534; font-weight: 800; }
    
    .assinatura { margin-top: auto; border-top: 1.5px solid #0f172a; width: 60%; padding-top: 3px; font-size: 7.5pt; font-weight: bold; color: #0f172a; text-align: center; }

    @media print { 
        body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; } 
        .no-print { display: none !important; } 
        #relatorioContainer { padding: 0; display: block; }
        .pagina-a4 { box-shadow: none; margin: 0; height: 280mm; page-break-after: always; } 
    }
  </style>
</head>
<body>

  <div class="no-print">
    <select id="selTurma"></select>
    <select id="selTrimestre">
      <option value="1º Trimestre">1º Trimestre</option>
      <option value="2º Trimestre" selected>2º Trimestre</option>
      <option value="3º Trimestre">3º Trimestre</option>
      <option value="FINAL" style="background: #facc15; color: #0f172a;">★ SITUAÇÃO FINAL (ATA)</option>
    </select>
    <button class="btn-acao" onclick="gerarBilhetes()"><i class="fa-solid fa-gears"></i> Gerar Bilhetes Legais (Para Todos)</button>
    <button class="btn-acao" style="background:#0f172a;" onclick="window.print()"><i class="fa-solid fa-print"></i> Imprimir</button>
  </div>

  <div id="relatorioContainer">
      <h3 style="text-align: center; color: #475569; margin-top: 50px;">Clique em "Gerar Bilhetes Legais"</h3>
  </div>

  <script>
    var turmasGlobais = ["6R1", "6R2", "6R3", "6R4", "7R1", "7R2", "7R3", "7R4", "8R1", "8R2", "8R3", "8R4", "9R1", "9R2", "9R3", "9R4"];
    var selTurma = document.getElementById('selTurma');
    turmasGlobais.forEach(t => selTurma.innerHTML += `<option value="${t}">${t}</option>`);

    var comp = ["Arte", "Ciências", "Educação Física", "Ensino Religioso", "Geografia", "História", "Língua Inglesa", "Língua Portuguesa", "Matemática"];
    
    // Mapeamento para decifrar a Progressão Parcial do Final
    var mapSiglas = { "ART":"Arte", "CIÊ":"Ciências", "EDF":"Educação Física", "ER":"Ensino Religioso", "GEO":"Geografia", "HIST":"História", "LI":"Língua Inglesa", "LP":"Língua Portuguesa", "MAT":"Matemática" };

    function gerarBilhetes() {
        var turma = selTurma.value;
        var trim = document.getElementById('selTrimestre').value;
        var container = document.getElementById('relatorioContainer');

        var alunosRaw = JSON.parse(localStorage.getItem('mestra_estudantes_' + turma) || '[]');
        var alunos = []; var vistos = new Set();
        alunosRaw.forEach(a => { if(!vistos.has(a.nome)){ vistos.add(a.nome); alunos.push(a); }});
        
        if (alunos.length === 0) { alert("Nenhum estudante na turma."); return; }

        var htmlFinal = '';
        var contador = 0;

        if (trim === 'FINAL') {
            var notasSalvas = JSON.parse(localStorage.getItem('mestra_resultados_final_' + turma) || '{}');
            
            alunos.forEach((a, index) => {
                if (contador === 0) htmlFinal += `<div class="pagina-a4">`;
                
                var d = notasSalvas[a.nome] || { status: 'APROVADO(A)', prog: '' };
                var baseLegal = ""; var acaoTexto = ""; var classeTexto = "texto-oficial";

                // FUNDAMENTAÇÃO LEGAL EXATA CONFORME RESOLUÇÕES
                if (d.status.includes('JANEIRO')) {
                    baseLegal = "Resolução SEE nº 4.948/2024 (Art. 112) e Resolução SEE nº 5.209/2025 (Art. 3º, inciso V)";
                    acaoTexto = "O(a) estudante não atingiu a média e fará a <strong>PROVA ELETRÔNICA EM JANEIRO</strong>.";
                } else if (d.status.includes('PROGRESSÃO')) {
                    baseLegal = "Resolução SEE nº 4.948/2024 (Arts. 112 e 118)";
                    acaoTexto = "O(a) estudante foi <strong>APROVADO(A) COM PROGRESSÃO PARCIAL</strong> nas disciplinas destacadas, devendo cumprir estudos orientados no ano letivo subsequente.";
                } else if (d.status.includes('REPROVADO')) {
                    baseLegal = "Resolução SEE nº 4.948/2024 (Art. 112)";
                    acaoTexto = "Comunicamos que o(a) estudante foi <strong>REPROVADO(A)</strong>.";
                } else {
                    baseLegal = "Resolução SEE nº 4.948/2024 (Art. 112)";
                    acaoTexto = "<i class='fa-solid fa-star'></i> Parabéns! Comunicamos que o(a) estudante foi <strong>APROVADO(A)</strong>.";
                    classeTexto = "texto-sucesso";
                }

                var avisoLegal = `Senhor(a) Responsável, em estrito cumprimento à <strong>${baseLegal}</strong>, comunicamos o resultado da aprendizagem do <strong>Ano Letivo</strong>. ${acaoTexto} Agradecemos a parceria da família!`;

                var gridDisciplinasHTML = '';
                if (d.status.includes('PROGRESSÃO') && d.prog) {
                    var siglasRetidas = d.prog.split(', ');
                    comp.forEach(c => {
                        var siglaCorreta = Object.keys(mapSiglas).find(key => mapSiglas[key] === c);
                        var retidoNesta = siglasRetidas.includes(siglaCorreta);
                        var classeCss = retidoNesta ? 'disp-ei' : 'disp-aprovado';
                        var siglaExtra = retidoNesta ? '(PROGRESSÃO PARCIAL)' : '(APROVADO(A))';
                        gridDisciplinasHTML += `<div class="disp-item ${classeCss}">${c} <span style="float:right;">${siglaExtra}</span></div>`;
                    });
                }

                htmlFinal += constroiBilhete(a.nome, turma, classeTexto, avisoLegal, gridDisciplinasHTML);
                contador++; if (contador === 4 || index === alunos.length - 1) { htmlFinal += `</div>`; contador = 0; }
            });

        } else {
            var notasSalvas = JSON.parse(localStorage.getItem('mestra_resultados_' + turma + '_' + trim) || '{}');
            
            alunos.forEach((a, index) => {
                if (contador === 0) htmlFinal += `<div class="pagina-a4">`;

                var dadosAluno = notasSalvas[a.nome] || {};
                var temProblema = false;
                var gridDisciplinasHTML = '';
                
                comp.forEach(c => {
                    var status = dadosAluno[c] || 'APROVADO';
                    var classeCss = 'disp-aprovado'; var siglaExtra = '(APROVADO(A))';
                    
                    if (status === 'REC') { classeCss = 'disp-rec'; siglaExtra = '(REC)'; temProblema = true; }
                    if (status === 'EI') { classeCss = 'disp-ei'; siglaExtra = '(ESTUDOS INDEPENDENTES)'; temProblema = true; }
                    if (status === 'REP') { classeCss = 'disp-rec'; siglaExtra = '(REPROVADO)'; temProblema = true; }
                    
                    gridDisciplinasHTML += `<div class="disp-item ${classeCss}">${c} <span style="float:right;">${siglaExtra}</span></div>`;
                });

                // FUNDAMENTAÇÃO LEGAL TRIMESTRAL
                var baseLegal = temProblema 
                    ? `Resolução SEE nº 4.948/2024 (Art. 108) e Resolução SEE nº 5.209/2025 (Art. 3º, inciso ${trim === '3º Trimestre' ? 'IV' : 'II'})`
                    : `Resolução SEE nº 4.948/2024 (Art. 108)`;

                var avisoLegal = temProblema 
                    ? `Senhor(a) Responsável, em estrito cumprimento à <strong>${baseLegal}</strong>, comunicamos o resultado da aprendizagem do <strong>${trim}</strong>. O(a) estudante encontra-se em situação de intervenção pedagógica nas disciplinas destacadas a vermelho/amarelo. É fundamental o acompanhamento da família.`
                    : `<i class="fa-solid fa-star"></i> Senhor(a) Responsável, em cumprimento à <strong>${baseLegal}</strong>, comunicamos o resultado da aprendizagem do <strong>${trim}</strong>. O(a) estudante foi <strong>APROVADO(A)</strong> em todos os componentes. Agradecemos a parceria da família!`;

                var classeTexto = temProblema ? "texto-oficial" : "texto-sucesso";

                htmlFinal += constroiBilhete(a.nome, turma, classeTexto, avisoLegal, gridDisciplinasHTML);
                contador++; if (contador === 4 || index === alunos.length - 1) { htmlFinal += `</div>`; contador = 0; }
            });
        }
        container.innerHTML = htmlFinal;
    }

    function constroiBilhete(nome, turma, classeTexto, avisoLegal, gridDisciplinasHTML) {
        return `
            <div class="bilhete">
                <div class="header-b">
                    <img src="https://i.ibb.co/Mk85hWrs/LOGO-MESTRA-AURORA-2.png" alt="Logo">
                    <div>
                        <h2>Escola Estadual Mestra Aurora</h2>
                        <p>Comunicado Oficial de Resultados de Aprendizagem</p>
                    </div>
                </div>
                
                <div class="tarja-estudante">
                    <span>ESTUDANTE: ${nome}</span>
                    <span>TURMA: ${turma}</span>
                </div>

                <div class="${classeTexto}">${avisoLegal}</div>
                
                ${gridDisciplinasHTML ? `<div class="disciplinas-grid">${gridDisciplinasHTML}</div>` : ''}
                
                <div class="assinatura">EQUIPE PEDAGÓGICA / ESPECIALISTA</div>
            </div>
        `;
    }
  </script>
</body>
</html>
