<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração de Equipe e Turnos - Conselho de Classe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f1f5f9; color: #0f172a; font-family: 'Inter', sans-serif; padding: 30px; }
    .config-container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .input-field { width: 100%; background: #fff; border: 2px solid #cbd5e1; border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 0.85rem; outline: none; transition: 0.2s; }
    .input-field:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .btn-action { background: #4f46e5; color: white; border: 2px solid #4338ca; border-radius: 10px; padding: 12px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.2s; }
    .btn-action:hover { background: #4338ca; }
  </style>
</head>
<body>

  <div class="config-container">
    <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
      <div class="d-flex align-items-center gap-3">
        <div style="width: 45px; height: 45px; background: #eef2ff; color: #4f46e5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
          <i class="fa-solid fa-users-gear"></i>
        </div>
        <div>
          <h4 class="fw-bold m-0" style="font-size: 1.15rem;">Configuração Antecipada de Equipe</h4>
          <p class="text-muted m-0" style="font-size: 0.8rem;">E. E. Mestra Aurora - Dados para Atas e Conselhos</p>
        </div>
      </div>
      <a href="index.html" class="btn btn-sm btn-outline-dark fw-bold"><i class="fa-solid fa-arrow-left me-1"></i> Voltar</a>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold" style="font-size: 0.85rem;">Selecione o Turno:</label>
      <select id="selectTurnoConfig" class="input-field fw-bold" onchange="carregarDadosTurno()">
        <option value="Matutino">Turno Matutino</option>
        <option value="Vespertino">Turno Vespertino</option>
      </select>
    </div>

    <h6 class="fw-bold mt-4 mb-3 text-primary"><i class="fa-solid fa-school-flag me-2"></i>Equipe Gestora e Apoio</h6>
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label class="form-label fw-bold fs-7">Diretor(a):</label>
        <input type="text" id="cfgDiretor" class="input-field" placeholder="Nome do(a) Diretor(a)">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold fs-7">Vice-Diretor(a):</label>
        <input type="text" id="cfgVice" class="input-field" placeholder="Nome do(a) Vice-Diretor(a)">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold fs-7">Especialista / EEB:</label>
        <input type="text" id="cfgEspecialista" class="input-field" placeholder="Nome do(a) Especialista">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold fs-7">Professor(a) de Apoio:</label>
        <input type="text" id="cfgApoio" class="input-field" placeholder="Nome do(a) Prof. de Apoio">
      </div>
    </div>

    <h6 class="fw-bold mt-4 mb-3 text-primary"><i class="fa-solid fa-chalkboard-user me-2"></i>Professores Regentes por Componente</h6>
    <div class="row g-3 mb-4" id="listaProfessoresRegentes">
      <div class="col-md-6"><label class="form-label fw-bold fs-7">Arte:</label><input type="text" class="input-field regente-comp" data-comp="Arte" placeholder="Professor(a)"></div>
      <div class="col-md-6"><label class="form-label fw-bold fs-7">Ciências:</label><input type="text" class="input-field regente-comp" data-comp="Ciências" placeholder="Professor(a)"></div>
      <div class="col-md-6"><label class="form-label fw-bold fs-7">Educação Física:</label><input type="text" class="input-field regente-comp" data-comp="Educação Física" placeholder="Professor(a)"></div>
      <div class="col-md-6"><label class="form-label fw-bold fs-7">Ensino Religioso:</label><input type="text" class="input-field regente-comp" data-comp="Ensino Religioso" placeholder="Professor(a)"></div>
      <div class="col-md-6"><label class="form-label fw-bold fs-7">Geografia:</label><input type="text" class="input-field regente-comp" data-comp="Geografia" placeholder="Professor(a)"></div>
      <div class="col-md-6"><label class="form-label fw-bold fs-7">História:</label><input type="text" class="input-field regente-comp" data-comp="História" placeholder="Professor(a)"></div>
      <div class="col-md-6"><label class="form-label fw-bold fs-7">Língua Inglesa:</label><input type="text" class="input-field regente-comp" data-comp="Língua Inglesa" placeholder="Professor(a)"></div>
      <div class="col-md-6"><label class="form-label fw-bold fs-7">Língua Portuguesa:</label><input type="text" class="input-field regente-comp" data-comp="Língua Portuguesa" placeholder="Professor(a)"></div>
      <div class="col-md-6"><label class="form-label fw-bold fs-7">Matemática:</label><input type="text" class="input-field regente-comp" data-comp="Matemática" placeholder="Professor(a)"></div>
    </div>

    <button class="btn-action py-3" onclick="salvarConfiguracaoEquipe()">
      <i class="fa-solid fa-floppy-disk me-2"></i> Salvar Configuração do Turno
    </button>
  </div>

  <script>
    function carregarDadosTurno() {
      var turno = document.getElementById('selectTurnoConfig').value;
      var salvo = localStorage.getItem('config_equipe_' + turno);
      if (salvo) {
        var dados = JSON.parse(salvo);
        document.getElementById('cfgDiretor').value = dados.diretor || '';
        document.getElementById('cfgVice').value = dados.vice || '';
        document.getElementById('cfgEspecialista').value = dados.especialista || '';
        document.getElementById('cfgApoio').value = dados.apoio || '';
        
        var inputsRegentes = document.querySelectorAll('.regente-comp');
        inputsRegentes.forEach(input => {
          var comp = input.getAttribute('data-comp');
          input.value = dados.regentes && dados.regentes[comp] ? dados.regentes[comp] : '';
        });
      } else {
        document.getElementById('cfgDiretor').value = '';
        document.getElementById('cfgVice').value = '';
        document.getElementById('cfgEspecialista').value = '';
        document.getElementById('cfgApoio').value = '';
        document.querySelectorAll('.regente-comp').forEach(i => i.value = '');
      }
    }

    function salvarConfiguracaoEquipe() {
      var turno = document.getElementById('selectTurnoConfig').value;
      var regentes = {};
      document.querySelectorAll('.regente-comp').forEach(input => {
        regentes[input.getAttribute('data-comp')] = input.value;
      });

      var config = {
        diretor: document.getElementById('cfgDiretor').value,
        vice: document.getElementById('cfgVice').value,
        especialista: document.getElementById('cfgEspecialista').value,
        apoio: document.getElementById('cfgApoio').value,
        regentes: regentes
      };

      localStorage.setItem('config_equipe_' + turno, JSON.stringify(config));
      alert('Configuração da equipe do turno ' + turno + ' salva com sucesso!');
    }

    window.onload = function() {
      carregarDadosTurno();
    };
  </script>
</body>
</html>
