<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotação Global de Equipe - Conselho de Classe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f1f5f9; color: #0f172a; font-family: 'Inter', sans-serif; padding: 30px; }
    .config-container { max-width: 1000px; margin: 0 auto; background: #ffffff; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .input-field { width: 100%; background: #fff; border: 2px solid #cbd5e1; border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 0.85rem; outline: none; transition: 0.2s; }
    .input-field:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .btn-action { background: #4f46e5; color: white; border: 2px solid #4338ca; border-radius: 10px; padding: 14px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.2s; font-size: 1rem; }
    .btn-action:hover { background: #4338ca; }
    .prof-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 14px; padding: 20px; margin-bottom: 15px; position: relative; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .checkbox-group label { font-size: 0.75rem; font-weight: 700; background: #fff; border: 1px solid #cbd5e1; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .checkbox-group input:checked + span { color: #4f46e5; }
  </style>
</head>
<body>

  <div class="config-container">
    <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
      <div class="d-flex align-items-center gap-3">
        <div style="width: 45px; height: 45px; background: #eef2ff; color: #4f46e5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
          <i class="fa-solid id-card fa-users-viewfinder"></i>
        </div>
        <div>
          <h4 class="fw-bold m-0" style="font-size: 1.15rem;">Painel Mestre de Lotação (Equipe e Professores)</h4>
          <p class="text-muted m-0" style="font-size: 0.8rem;">E. E. Mestra Aurora - Cadastro Único Global</p>
        </div>
      </div>
      <a href="index.html" class="btn btn-sm btn-outline-dark fw-bold"><i class="fa-solid fa-arrow-left me-1"></i> Voltar ao Início</a>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold text-primary m-0"><i class="fa-solid fa-list-check me-2"></i>Profissionais Cadastrados na Escola</h6>
      <button class="btn btn-sm btn-success fw-bold px-3 py-2" onclick="adicionarCardProfissional()"><i class="fa-solid fa-plus me-1"></i> Adicionar Profissional</button>
    </div>

    <div id="containerProfissionais" class="mb-4">
      <!-- Cards gerados dinamicamente -->
    </div>

    <button class="btn-action shadow-sm" onclick="salvarLotacaoGlobal()">
      <i class="fa-solid fa-floppy-disk me-2"></i> Salvar Lotação Global na Planilha
    </button>
  </div>

  <script>
    var listaTurmasGlobal = ["6R1", "6R2", "6R3", "6R4", "7R1", "7R2", "7R3", "7R4", "8R1", "8R2", "8R3", "8R4", "9R1", "9R2", "9R3", "9R4"];
    var listaComponentesGlobal = ["Arte", "Ciências", "Educação Física", "Ensino Religioso", "Geografia", "História", "Língua Inglesa", "Língua Portuguesa", "Matemática"];
    var listaCargosGlobal = ["Diretor(a)", "Vice-Diretor(a)", "Especialista / EEB", "Professor(a) de Apoio", "Professor(a) Regente"];

    window.onload = function() {
      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(function(dados) {
          if (dados && dados.length > 0) {
            dados.forEach(p => adicionarCardProfissional(p));
          } else {
            adicionarCardProfissional(); // Pelo menos um em branco
          }
        }).carregarLotacaoGlobal();
      } else {
        adicionarCardProfissional();
      }
    };

    function adicionarCardProfissional(dados = {}) {
      var container = document.getElementById('containerProfissionais');
      var idU = Date.now() + Math.random();

      var cargosHtml = '';
      listaCargosGlobal.forEach(c => {
        var sel = dados.cargo === c ? 'selected' : '';
        cargosHtml += `<option ${sel}>${c}</option>`;
      });

      var turnosHtml = '';
      ["Matutino", "Vespertino"].forEach(t => {
        var chk = dados.turnos && dados.turnos.includes(t) ? 'checked' : '';
        turnosHtml += `<label><input type="checkbox" class="t_turno_${idU}" value="${t}" ${chk}> <span>${t}</span></label>`;
      });

      var turmasHtml = '';
      listaTurmasGlobal.forEach(t => {
        var chk = dados.turmas && dados.turmas.includes(t) ? 'checked' : '';
        turmasHtml += `<label><input type="checkbox" class="t_turma_${idU}" value="${t}" ${chk}> <span>${t}</span></label>`;
      });

      var compHtml = '';
      listaComponentesGlobal.forEach(c => {
        var chk = dados.componentes && dados.componentes.includes(c) ? 'checked' : '';
        compHtml += `<label><input type="checkbox" class="t_comp_${idU}" value="${c}" ${chk}> <span>${c}</span></label>`;
      });

      var card = document.createElement('div');
      card.className = 'prof-card';
      card.id = 'card_' + idU;
      card.innerHTML = `
        <button class="btn btn-sm btn-outline-danger position-absolute top-0 end-0 m-3" onclick="document.getElementById('card_${idU}').remove()"><i class="fa-solid fa-trash"></i> Excluir</button>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold fs-7">Nome do Profissional:</label>
            <input type="text" class="input-field prof-nome" placeholder="Nome Completo" value="${dados.nome || ''}">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold fs-7">Cargo / Função:</label>
            <select class="input-field prof-cargo">${cargosHtml}</select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-bold fs-7">Turnos de Atuação:</label>
            <div class="checkbox-group">${turnosHtml}</div>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label fw-bold fs-7 text-primary">Turmas Atendidas (Marque quantas precisar):</label>
          <div class="checkbox-group">${turmasHtml}</div>
        </div>
        <div>
          <label class="form-label fw-bold fs-7 text-success">Componentes Curriculares (Se aplicável):</label>
          <div class="checkbox-group">${compHtml}</div>
        </div>
        <input type="hidden" class="prof-id" value="${idU}">
      `;
      container.appendChild(card);
    }

    function salvarLotacaoGlobal() {
      var lista = [];
      document.querySelectorAll('.prof-card').forEach(card => {
        var nome = card.querySelector('.prof-nome').value;
        var cargo = card.querySelector('.prof-cargo').value;
        var idU = card.querySelector('.prof-id').value;

        var turnos = [];
        card.querySelectorAll('.t_turno_' + idU + ':checked').forEach(el => turnos.push(el.value));

        var turmas = [];
        card.querySelectorAll('.t_turma_' + idU + ':checked').forEach(el => turmas.push(el.value));

        var componentes = [];
        card.querySelectorAll('.t_comp_' + idU + ':checked').forEach(el => componentes.push(el.value));

        if (nome) {
          lista.push({ nome: nome, cargo: cargo, turnos: turnos, turmas: turmas, componentes: componentes });
        }
      });

      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(function() {
          alert('Lotação global salva com sucesso na planilha!');
        }).salvarLotacaoGlobal(lista);
      } else {
        alert('Lotação salva com sucesso!');
      }
    }
  </script>
</body>
</html>
