<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ata de Conselho de Classe - Situação Final</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    @page { size: A4 portrait; margin: 15mm; } 
    body { font-family: 'Inter', Arial, sans-serif; margin: 0; background: #e2e8f0; color: #0f172a; } 
    
    .no-print { background: #0f172a; padding: 15px; display: flex; gap: 15px; justify-content: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; }
    select, input, textarea { padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-family: 'Inter'; outline: none; }
    .btn-acao { background: #4f46e5; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    
    .pagina-a4 { width: 100%; max-width: 210mm; min-height: 297mm; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin: 20px auto; padding: 15mm; page-break-after: always; text-align: justify; }
    
    .texto-base { font-size: 10pt; line-height: 1.4; margin-bottom: 10px; text-align: justify; }
    
    .tabela-final { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 10px; font-size: 9pt; }
    .tabela-final th { border: 1px solid #0f172a; padding: 6px; background: #e2e8f0; text-align: center; font-weight: 900; }
    .tabela-final td { border: 1px solid #0f172a; padding: 6px; vertical-align: middle; }
    
    .td-centro { text-align: center; font-weight: bold; }
    .td-nome { font-weight: bold; }
    
    .caixa-edicao { background: #f8fafc; padding: 15px; border: 1px dashed #94a3b8; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 900px; margin: 20px auto; }
    .caixa-edicao h4 { margin-top: 0; color: #334155; }

    @media print { 
        body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; } 
        .no-print, .caixa-edicao { display: none !important; } 
        .pagina-a4 { box-shadow: none; margin: 0; padding: 0; } 
    }
  </style>
</head>
<body>

  <div class="no-print">
    <select id="selTurma"></select>
    <button class="btn-acao" onclick="gerarAta()"><i class="fa-solid fa-file-signature"></i> Processar Ata Final</button>
    <button class="btn-acao" style="background:#10b981;" onclick="window.print()"><i class="fa-solid fa-print"></i> Imprimir Ata</button>
  </div>

  <div class="caixa-edicao">
      <h4><i class="fa-solid fa-pen-to-square"></i> Dados para o Cabeçalho da Ata</h4>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
          <input type="text" id="inpNumeroAta" value="5ª Ata" placeholder="Ex: 5ª Ata">
          <input type="text" id="inpAno" value="2026" placeholder="Ano Letivo">
          <input type="text" id="inpData" value="12 de Dezembro de 2026" placeholder="Data por Extenso">
          <input type="text" id="inpHora" value="17h40" placeholder="Hora">
          <input type="text" id="inpSala" value="sala 11, Sala de Reuniões" placeholder="Local">
          <input type="text" id="inpDiretor" value="Adilson de Paulo Ventura" placeholder="Nome Diretor(a)">
          <input type="text" id="inpVice" value="Vera Lúcia Lemes Machado" placeholder="Nome Vice-Diretor(a)">
          <input type="text" id="inpEspecialistas" value="Maria de Lourdes Macedo e Carlos André Vieira" placeholder="Nomes Especialistas">
      </div>
      <textarea id="inpProfessores" rows="2" style="width: 100%;" placeholder="Nomes dos Professores Presentes">Celma Maria Barbosa Santos, Katiany De Fatima Vieira, Henrique Rocha Sudré, Janaine Aparecida Antunes, Luis Paulo Sant'ana, Lourdes Gomes Do Amaral Lemos, Vanderléia De Fátima Rosa Carvalho e Verônica De Jesus Antunes</textarea>
  </div>

  <div id="relatorioContainer">
      <h3 style="text-align: center; color: #475569; margin-top: 50px;">Selecione a turma e clique em "Processar Ata Final"</h3>
  </div>

  <script>
    var turmasGlobais = ["6R1", "6R2", "6R3", "6R4", "7R1", "7R2", "7R3", "7R4", "8R1", "8R2", "8R3", "8R4", "9R1", "9R2", "9R3", "9R4"];
    var selTurma = document.getElementById('selTurma');
    turmasGlobais.forEach(t => selTurma.innerHTML += `<option value="${t}">${t}</option>`);
    
    var mapSiglas = { "ART":"Arte", "CIÊ":"Ciências", "EDF":"Educação Física", "ER":"Ensino Religioso", "GEO":"Geografia", "HIST":"História", "LI":"Língua Inglesa", "LP":"Língua Portuguesa", "MAT":"Matemática" };

    function gerarAta() {
        var turma = selTurma.value;
        var container = document.getElementById('relatorioContainer');

        var alunosRaw = JSON.parse(localStorage.getItem('mestra_estudantes_' + turma) || '[]');
        var alunos = []; var vistos = new Set();
        alunosRaw.forEach(a => { if(!vistos.has(a.nome)){ vistos.add(a.nome); alunos.push(a); }});
        
        var notasSalvas = JSON.parse(localStorage.getItem('mestra_resultados_final_' + turma) || '{}');

        if (alunos.length === 0) { alert("Nenhum estudante na turma."); return; }

        var numAta = document.getElementById('inpNumeroAta').value;
        var anoLetivo = document.getElementById('inpAno').value;
        var dataAta = document.getElementById('inpData').value;
        var horaAta = document.getElementById('inpHora').value;
        var salaAta = document.getElementById('inpSala').value;
        var diretor = document.getElementById('inpDiretor').value;
        var vice = document.getElementById('inpVice').value;
        var esp = document.getElementById('inpEspecialistas').value;
        var profs = document.getElementById('inpProfessores').value;

        var linhasTabela = '';
        var num = 1;

        alunos.forEach(a => {
            var sit = notasSalvas[a.nome] || { status: 'APROVADO(A)', prog: '' };
            var siglaFormatada = '-';
            
            if (sit.status === 'APROVADO(A) COM PROGRESSÃO PARCIAL' && sit.prog) {
                var siglas = sit.prog.split(', ');
                var nomesCompletos = siglas.map(s => mapSiglas[s] || s);
                siglaFormatada = nomesCompletos.join(', '); // Aqui convertemos para nomes completos (Sem Abreviação)!
            }

            linhasTabela += `
                <tr>
                    <td class="td-centro">${num < 10 ? '0'+num : num}</td>
                    <td class="td-nome">${a.nome}</td>
                    <td class="td-centro">${sit.status}</td>
                    <td class="td-centro" style="color: #b91c1c;">${siglaFormatada}</td>
                </tr>
            `;
            num++;
        });

        var htmlFinal = `
        <div class="pagina-a4">
            <div class="texto-base" style="text-indent: 20px;">
                ${numAta} do Conselho de Classe da turma ${turma} referente ao Situação Final do ano de ${anoLetivo}. A presente Ata, objetiva, registrar a situação dos/das estudantes do ano de ${anoLetivo}, fundamentando-se e baseando-se nas orientações do Documento Orientador expedido pela SEE/MG, da Resolução SEE Nº 4.948 de 25 de janeiro de 2024, Memorando Nº 337/2024/SEE/SB e Documento Orientador do Conselho de Classe. Aos ${dataAta}, reuniram-se na ${salaAta} da Escola, às ${horaAta}, os membros do Conselho de Classe, coordenado pelo Diretor ${diretor}, a Vice-Diretora ${vice} e pelos Especialistas, ${esp}, e os seguintes docentes: ${profs}, com a finalidade de avaliar, de forma Global as competências (conhecimentos e habilidades adquiridos pelos estudantes), pautando-se na Resolução SEE Nº 4.948 de 25 de janeiro de 2024, Artigo 107 e Parágrafo único, no Artigo 109 e Parágrafo único e no Artigo 110, que seguem, Art. 107- A escola deverá oferecer aos estudantes diferentes oportunidades de aprendizagem com atividades de intervenções pedagógicas ao longo de todo o ano letivo, a saber: I - estudos contínuos de recuperação, ao longo do processo de ensino e aprendizagem, em sala de aula, constituídos de atividades específicas para o atendimento ao estudante ou grupos de estudantes que não desenvolveram as habilidades trabalhadas; II - estudos periódicos de recuperação, aplicados ao final de cada bimestre, antes da realização do Conselho de Classe, para o estudante ou grupo de estudantes que não desenvolveram as habilidades previstas para o bimestre; III - estudos independentes de recuperação, realizados após o último conselho de classe, com atividades avaliativas a serem aplicadas antes do encerramento do ano escolar, quando as estratégias de intervenção pedagógica previstas nos incisos I e II não tiverem sido suficientes para atender às necessidades mínimas de aprendizagem do estudante. Parágrafo único. Para os estudos independentes de recuperação, deverá ser elaborado, pelo professor responsável pelo componente curricular, um plano de estudos, com orientações e atividades que contemplem o(s) objeto(s) do conhecimento e a(s) habilidade(s) que não foram consolidadas pelo estudante; Art. 109- O Conselho de Classe é uma instância colegiada, responsável por favorecer a articulação entre professores, realizar a análise das metodologias utilizadas, estabelecer a relação dos diversos pontos de vistas e as intervenções necessárias nos processos de ensino e de aprendizagem. Parágrafo único. O Conselho de Classe terá sua composição e organização regulamentadas por documento específico; Art. 110- A promoção dos estudantes deve ser decidida, coletivamente, pelos professores no Conselho de Classe, levando-se em conta o desempenho global do estudante, seu envolvimento no processo de aprender e não apenas a avaliação de cada professor em seu componente curricular, de forma isolada, considerando-se os princípios da continuidade da aprendizagem e da interdisciplinaridade reuniu-se os membros supramencionados, que compõem o Conselho de Classe, com o objetivo de decidir, coletivamente, o desempenho global de cada estudante, levando em conta o envolvimento deste no processo de aprender no contexto geral, pautando-se, principalmente, na sua continuidade em relação ao desenvolvimento da aprendizagem, foco principal da reunião.
            </div>
            
            <div class="texto-base" style="text-indent: 20px;">
                Iniciando o Conselho de Classe da turma, o Diretor ${diretor}, reforçou pontos constantes e importantes do redimensionando o fazer pedagógico e, reforçou sobre o que a legislação no que se refere ao discutir sobre a situação final dos estudantes, e sobre a decisão coletiva do Conselho de Classe, devendo-se observar todo o percurso de cada estudante individualmente para consolidar a situação final de cada um dos estudantes da presente turma. Dando continuidade, o Diretor ${diretor}, passou a palavra para os Especialistas para que pudessem dar continuidade ao processo do Conselho de Classe final do ano corrente. Continuando, o Especialista da turma continuou com o Conselho de Classe Final, o qual passou a discutir a situação global de cada estudante, observando as diferentes oportunidades de aprendizagem desenvolvidas e oferecidas aos estudantes e as várias estratégias utilizadas, pautando-se principalmente na legislação supramencionada em sua totalidade, em relação ao ano corrente, e, levando em consideração a discussão feita pelo membros que constituem o Conselho de Classe, e, principalmente o contexto de cada um dos estudantes, perante a sua situação de aprendizagem com foco na continuidade de cada um, fica assim definida, no quadro abaixo, a situação final de cada estudante desta turma, e, nos casos de estudantes que ficaram em Progressão Parcial, de acordo com a legislação supramencionada, ficará com situação APROVADO(A) COM PROGRESSÃO PARCIAL e está registrado na coluna PROGRESSÃO PARCIAL, o(s) respectivo(s) Componente(s) Curricular(es) por extenso:
            </div>

            <table class="tabela-final">
                <thead>
                    <tr>
                        <th style="width: 5%;">Nº</th>
                        <th style="width: 40%;">ESTUDANTE</th>
                        <th style="width: 30%;">SITUAÇÃO FINAL DO ESTUDANTE EM RELAÇÃO AO ANO DE ${anoLetivo}</th>
                        <th style="width: 25%;">APROVADO(A) COM PROGRESSÃO PARCIAL EM</th>
                    </tr>
                </thead>
                <tbody>
                    ${linhasTabela}
                </tbody>
            </table>

            <div class="texto-base" style="text-indent: 20px;">
                O Diretor ${diretor}, retomou a palavra e indagou, aos presentes, se haveria mais alguma observação e ninguém se manifestou. Por fim, o Diretor ${diretor}, agradeceu a todos e parabenizou pelo esforço e empenho durante o período. Nada mais havendo a tratar, eu, Especialista designado(a) para lavrar a presente Ata, que depois de lida e aprovada, será assinada por todos os presentes. Carbonita, ${dataAta}.
            </div>
        </div>
        `;

        container.innerHTML = htmlFinal;
    }
  </script>
</body>
</html>
