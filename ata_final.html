<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ata de Conselho de Classe - Situação Final</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    @page { size: A4 portrait; margin: 15mm; } 
    body { font-family: 'Inter', Arial, sans-serif; margin: 0; background: #e2e8f0; color: #0f172a; } 
    
    .no-print { background: #0f172a; padding: 15px; display: flex; gap: 15px; justify-content: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; }
    select, input, textarea { padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-family: 'Inter'; outline: none; }
    .btn-acao { background: #4f46e5; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-aviso { background: #f59e0b; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 6px; cursor: default; display: flex; align-items: center; gap: 8px; }
    
    /* A folha A4 editável */
    .pagina-a4 { 
        width: 100%; max-width: 210mm; min-height: 297mm; 
        background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        margin: 20px auto; padding: 15mm; 
        text-align: justify; 
        transition: 0.3s;
    }
    
    /* Destaque visual para mostrar que a folha é editável */
    .pagina-a4[contenteditable="true"]:hover {
        box-shadow: 0 0 0 3px #60a5fa, 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .texto-base { font-size: 10pt; line-height: 1.4; margin-bottom: 10px; text-align: justify; }
    
    .tabela-final { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 15px; font-size: 8.5pt; }
    .tabela-final th { border: 1px solid #0f172a; padding: 6px; background: #e2e8f0; text-align: center; font-weight: 900; }
    .tabela-final td { border: 1px solid #0f172a; padding: 6px; vertical-align: middle; }
    
    .td-centro { text-align: center; font-weight: bold; }
    .td-nome { font-weight: bold; }
    
    .caixa-edicao { background: #f8fafc; padding: 15px; border: 1px dashed #94a3b8; border-radius: 8px; margin-bottom: 20px; width: 100%; max-width: 900px; margin: 20px auto; }
    .caixa-edicao h4 { margin-top: 0; color: #334155; }

    @media print { 
        body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; } 
        .no-print, .caixa-edicao { display: none !important; } 
        .pagina-a4 { box-shadow: none; margin: 0; padding: 0; border: none; } 
    }
  </style>
</head>
<body>

  <div class="no-print">
    <select id="selTurma"></select>
    <button class="btn-acao" onclick="gerarAta()"><i class="fa-solid fa-file-signature"></i> 1. Gerar Ata Final</button>
    <div class="btn-aviso"><i class="fa-solid fa-pen"></i> 2. Clique no texto gerado abaixo para editar!</div>
    <button class="btn-acao" style="background:#10b981;" onclick="window.print()"><i class="fa-solid fa-print"></i> 3. Imprimir</button>
  </div>

  <div class="caixa-edicao">
      <h4><i class="fa-solid fa-pen-to-square"></i> Dados para o Cabeçalho da Ata</h4>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
          <input type="text" id="inpNumeroAta" value="5ª Ata" placeholder="Ex: 5ª Ata">
          <input type="text" id="inpAno" value="2026" placeholder="Ano Letivo">
          <input type="text" id="inpData" value="12 de Dezembro de 2026" placeholder="Data por Extenso">
          <input type="text" id="inpHora" value="17h40" placeholder="Hora">
          <input type="text" id="inpSala" value="sala 11, Sala de Reuniões" placeholder="Local">
          <input type="text" id="inpDiretor" value="Adilson de Paulo Ventura" placeholder="Nome Diretor(a)">
          <input type="text" id="inpVice" value="Vera Lúcia Lemes Machado" placeholder="Nome Vice-Diretor(a)">
          <input type="text" id="inpEspecialistas" value="Maria de Lourdes Macedo e Carlos André Vieira" placeholder="Nomes Especialistas">
      </div>
      <textarea id="inpProfessores" rows="2" style="width: 100%;" placeholder="Nomes dos Professores Presentes">Celma Maria Barbosa Santos, Katiany De Fatima Vieira, Henrique Rocha Sudré, Janaine Aparecida Antunes, Luis Paulo Sant'ana, Lourdes Gomes Do Amaral Lemos, Vanderléia De Fátima Rosa Carvalho e Verônica De Jesus Antunes</textarea>
  </div>

  <div id="relatorioContainer">
      <h3 style="text-align: center; color: #475569; margin-top: 50px;">Selecione a turma e clique em "Gerar Ata Final"</h3>
  </div>

  <script>
    var turmasGlobais = ["6R1", "6R2", "6R3", "6R4", "7R1", "7R2", "7R3", "7R4", "8R1", "8R2", "8R3", "8R4", "9R1", "9R2", "9R3", "9R4"];
    var selTurma = document.getElementById('selTurma');
    turmasGlobais.forEach(t => selTurma.innerHTML += `<option value="${t}">${t}</option>`);
    
    var mapSiglas = { "ART":"Arte", "CIÊ":"Ciências", "EDF":"Educação Física", "ER":"Ensino Religioso", "GEO":"Geografia", "HIST":"História", "LI":"Língua Inglesa", "LP":"Língua Portuguesa", "MAT":"Matemática" };
    var componentes = ["Arte", "Ciências", "Educação Física", "Ensino Religioso", "Geografia", "História", "Língua Inglesa", "Língua Portuguesa", "Matemática"];

    function gerarAta() {
        var turma = selTurma.value;
        var container = document.getElementById('relatorioContainer');

        var alunosRaw = JSON.parse(localStorage.getItem('mestra_estudantes_' + turma) || '[]');
        var alunos = []; var vistos = new Set();
        alunosRaw.forEach(a => { if(!vistos.has(a.nome)){ vistos.add(a.nome); alunos.push(a); }});
        
        var notasFinais = JSON.parse(localStorage.getItem('mestra_resultados_final_' + turma) || '{}');
        // Puxamos também as notas dos Estudos Independentes (3º Trimestre) para relatar as intervenções anteriores
        var notasEstudosIndep = JSON.parse(localStorage.getItem('mestra_resultados_' + turma + '_3º Trimestre') || '{}');

        if (alunos.length === 0) { alert("Nenhum estudante na turma."); return; }

        var numAta = document.getElementById('inpNumeroAta').value;
        var anoLetivo = document.getElementById('inpAno').value;
        var dataAta = document.getElementById('inpData').value;
        var horaAta = document.getElementById('inpHora').value;
        var salaAta = document.getElementById('inpSala').value;
        var diretor = document.getElementById('inpDiretor').value;
        var vice = document.getElementById('inpVice').value;
        var esp = document.getElementById('inpEspecialistas').value;
        var profs = document.getElementById('inpProfessores').value;

        var linhasTabela = '';
        var num = 1;

        alunos.forEach(a => {
            var sitFinal = notasFinais[a.nome] || { status: 'APROVADO(A)', prog: '' };
            var statusEstudosIndep = notasEstudosIndep[a.nome] || {};
            var componentesAfetados = [];

            // 1. Identificar se o aluno ficou em EI ou foi Retido nos Estudos Independentes
            componentes.forEach(c => {
                if(statusEstudosIndep[c] === 'EI' || statusEstudosIndep[c] === 'REP') {
                    componentesAfetados.push(c);
                }
            });

            // 2. Adicionar as disciplinas onde houve Progressão ou Prova de Janeiro na Matriz Final
            if (sitFinal.prog) {
                var siglas = sitFinal.prog.split(', ');
                siglas.forEach(s => {
                    var nomeCompleto = mapSiglas[s] || s;
                    if (!componentesAfetados.includes(nomeCompleto)) {
                        componentesAfetados.push(nomeCompleto);
                    }
                });
            }

            // Formatação do texto da coluna de componentes
            var siglaFormatada = '-';
            if (componentesAfetados.length > 0) {
                if (sitFinal.status === 'APROVADO(A)') {
                    siglaFormatada = 'Realizou EI em: ' + componentesAfetados.join(', ');
                } else {
                    siglaFormatada = componentesAfetados.join(', ');
                }
            }

            var corStatus = '#0f172a';
            if(sitFinal.status.includes('REPROVADO')) corStatus = '#991b1b';
            if(sitFinal.status.includes('JANEIRO')) corStatus = '#9a3412';
            if(sitFinal.status.includes('PROGRESSÃO')) corStatus = '#92400e';
            if(sitFinal.status === 'APROVADO(A)') corStatus = '#065f46';

            linhasTabela += `
                <tr>
                    <td class="td-centro">${num < 10 ? '0'+num : num}</td>
                    <td class="td-nome">${a.nome}</td>
                    <td class="td-centro" style="color: ${corStatus};">${sitFinal.status}</td>
                    <td class="td-centro" style="color: #b91c1c;">${siglaFormatada}</td>
                </tr>
            `;
            num++;
        });

        // O 'contenteditable="true"' permite editar tudo na página antes de imprimir!
        var htmlFinal = `
        <div class="pagina-a4" contenteditable="true" spellcheck="false" title="Pode clicar no texto e alterar o que precisar antes de imprimir!">
            <div class="texto-base" style="text-indent: 20px;">
                ${numAta} do Conselho de Classe da turma ${turma} referente à Situação Final do ano de ${anoLetivo}. A presente Ata, objetiva, registrar a situação dos/das estudantes do ano de ${anoLetivo}, fundamentando-se e baseando-se nas orientações do Documento Orientador expedido pela SEE/MG, da Resolução SEE Nº 4.948 de 25 de janeiro de 2024, da <strong>Resolução SEE Nº 5.209 de 07 de novembro de 2025</strong>, e Documentos Orientadores do Conselho de Classe. Aos ${dataAta}, reuniram-se na ${salaAta} da Escola, às ${horaAta}, os membros do Conselho de Classe, coordenado pelo Diretor(a) ${diretor}, a Vice-Diretora ${vice} e pelos Especialistas, ${esp}, e os seguintes docentes: ${profs}, com a finalidade de avaliar de forma Global as competências (conhecimentos e habilidades) adquiridos pelos estudantes.
            </div>
            
            <div class="texto-base" style="text-indent: 20px;">
                A reunião pautou-se na observância da legislação vigente, destacando-se o Artigo 107 da Res. SEE 4.948/2024, bem como os Artigos 1º, 2º e 3º da <strong>Resolução SEE Nº 5.209/2025</strong>, os quais determinam a oferta de diferentes oportunidades de aprendizagem e intervenção pedagógica ao longo do letivo (incisos I e II), além da realização de Estudos Independentes de Recuperação e o direito à realização de avaliação para fins de certificação e Prova Eletrônica para estudantes que não consolidaram as aprendizagens essenciais. O Conselho de Classe deliberou de forma colegiada, analisando o percurso escolar de cada estudante individualmente, o desenvolvimento das habilidades e as metodologias aplicadas, de acordo com o Art. 109 da Res. SEE 4.948/2024.
            </div>

            <div class="texto-base" style="text-indent: 20px;">
                Iniciando o Conselho de Classe da turma, a Direção reforçou pontos cruciais do fazer pedagógico, passando a palavra aos Especialistas para a condução das análises globais. Foram ponderadas as diversas estratégias utilizadas, o contexto de cada estudante e a oferta dos Estudos Independentes. Após a avaliação coletiva, fica definida no quadro abaixo a Situação Final de cada estudante. Nos casos em que o estudante necessitou de Estudos Independentes, obteve Progressão Parcial, foi submetido à Prova Eletrônica de Janeiro ou restou Reprovado, encontra-se devidamente identificado na tabela os respectivos Componentes Curriculares por extenso, assegurando o registro documental da continuidade do processo formativo:
            </div>

            <table class="tabela-final">
                <thead>
                    <tr>
                        <th style="width: 5%;">Nº</th>
                        <th style="width: 40%;">ESTUDANTE</th>
                        <th style="width: 25%;">SITUAÇÃO FINAL DO ESTUDANTE</th>
                        <th style="width: 30%;">COMPONENTES CURRICULARES<br>(Retenção / Janeiro / Progressão / EI)</th>
                    </tr>
                </thead>
                <tbody>
                    ${linhasTabela}
                </tbody>
            </table>

            <div class="texto-base" style="text-indent: 20px;">
                A Direção retomou a palavra e indagou aos presentes se haveria mais alguma observação, não havendo manifestações. Por fim, agradeceu o esforço e empenho de toda a equipa durante o ano letivo. Nada mais havendo a tratar, eu, Especialista designado(a) para lavrar a presente Ata, dou por encerrada a sessão, a qual, depois de lida e aprovada, será assinada por todos os presentes. Carbonita, ${dataAta}.
            </div>
            
            <div style="margin-top: 50px; text-align: center; font-weight: bold; font-size: 10pt;">
                _________________________________________________________________<br>
                Assinaturas da Equipe Pedagógica e Docentes
            </div>
        </div>
        `;

        container.innerHTML = htmlFinal;
    }
  </script>
</body>
</html>
