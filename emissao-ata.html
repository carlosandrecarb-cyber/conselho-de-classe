<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emissão de Ata - Conselho de Classe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f1f5f9; color: #0f172a; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .module-card { background: #ffffff; max-width: 500px; width: 100%; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .input-field { width: 100%; background: #fff; border: 2px solid #cbd5e1; border-radius: 10px; padding: 12px; font-weight: 600; font-size: 0.9rem; outline: none; transition: 0.2s; }
    .input-field:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .btn-action { background: #0f172a; color: white; border: 2px solid #0f172a; border-radius: 10px; padding: 12px; font-weight: 800; width: 100%; cursor: pointer; transition: 0.2s; }
    .btn-action:hover { background: #1e293b; }
  </style>
</head>
<body>

  <div class="module-card">
    <div class="d-flex align-items-center gap-3 mb-4">
      <div style="width: 45px; height: 45px; background: #f1f5f9; color: #0f172a; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
        <i class="fa-solid fa-file-lines"></i>
      </div>
      <div>
        <h4 class="fw-bold m-0" style="font-size: 1.15rem;">Emissão de Ata Oficial</h4>
        <p class="text-muted m-0" style="font-size: 0.8rem;">Compilação baseada no Molde do Google Docs</p>
      </div>
    </div>

    <div class="mb-3 text-start">
      <label class="form-label fw-bold" style="font-size: 0.85rem;">Trimestre Alvo:</label>
      <select id="selectTrimestre" class="input-field fw-bold">
        <option>1º Trimestre</option>
        <option>2º Trimestre</option>
        <option>3º Trimestre</option>
      </select>
    </div>

    <div class="mb-3 text-start">
      <label class="form-label fw-bold" style="font-size: 0.85rem;">Selecione a Turma:</label>
      <select id="selectTurma" class="input-field fw-bold"></select>
    </div>

    <div class="mb-4 text-start">
      <label class="form-label fw-bold" style="font-size: 0.85rem;">Link do Molde (Google Docs):</label>
      <input type="text" id="linkMoldeAta" class="input-field" placeholder="Cole o link do seu Google Docs...">
    </div>

    <button id="btnGerar" class="btn-action mb-3" onclick="gerarAtaPDF()">
      <i class="fa-solid fa-file-pen me-2"></i> Gerar Ata Oficial da Turma
    </button>

    <div id="loadingArea" style="display:none;" class="text-center my-3">
      <div class="spinner-border text-dark" role="status"></div>
      <p class="mt-2 fw-bold text-dark" style="font-size: 0.85rem;">Gerando ata com base no molde...</p>
    </div>

    <div id="resultArea" style="display:none;" class="my-3">
      <a id="linkDownload" href="#" target="_blank" class="btn btn-success w-100 py-3 fw-bold text-decoration-none" style="border-radius: 10px;">
        <i class="fa-solid fa-download me-2"></i> Abrir Ata Gerada
      </a>
    </div>

    <a href="index.html" class="btn btn-link w-100 text-muted fw-bold text-decoration-none mt-2" style="font-size: 0.85rem;">
      <i class="fa-solid fa-arrow-left me-1"></i> Voltar ao Portal Principal
    </a>
  </div>

  <script>
    window.onload = function() {
      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(function(turmas) {
          var el = document.getElementById('selectTurma');
          el.innerHTML = '<option value="">Selecione a Turma...</option>';
          turmas.forEach(t => el.innerHTML += '<option value="'+t+'">'+t+'</option>');
        }).getTurmas();
      }
    };

    function gerarAtaPDF() {
      var trim = document.getElementById('selectTrimestre').value;
      var turma = document.getElementById('selectTurma').value;
      var link = document.getElementById('linkMoldeAta').value;

      if (!turma) { alert("Selecione uma turma."); return; }
      if (!link || !link.includes("docs.google.com")) { alert("Cole um link válido do Google Docs."); return; }

      document.getElementById('btnGerar').style.display = 'none';
      document.getElementById('loadingArea').style.display = 'block';

      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(function(res) {
          document.getElementById('loadingArea').style.display = 'none';
          if(res.erro) {
            alert(res.erro);
            document.getElementById('btnGerar').style.display = 'block';
          } else {
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('linkDownload').href = res.url;
          }
        }).gerarAtaOficialPDF(trim, turma, link);
      }
    }
  </script>
</body>
</html>
